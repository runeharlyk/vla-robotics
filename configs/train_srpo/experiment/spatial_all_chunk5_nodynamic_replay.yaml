# @package _global_

metadata:
  label: spatial-all-chunk5-nodynamic-replay
  notes: "All-suite chunk-5 run without dynamic sampling. Tests whether the task-5 chunk benefit transfers when dynamic sampling is removed."

task_ids: all
mode: sparse_rl
update_method: fpo
lr: 2e-6
iterations: 45
eval_every: 15
eval_episodes: 20
wandb_name: spatial-all-chunk5-nodynamic-lr2e6-sftkl002-replay320-demos

kl:
  coeff: 0.01
  sft_coeff: 0.02

replay:
  include_demos: true
  success_total_size: 320
  success_alpha: 1.0
  success_ema_decay: 0.8
  success_max_ratio: 0.5

sampling:
  dynamic: false
  dynamic_max_retries: 2

rollout:
  n_action_steps: 5

fpo:
  full_chunk_target: true
