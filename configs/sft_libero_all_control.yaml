action: train-sft-libero
label: "Job A — control: continued SFT on all 4 LIBERO suites (no augmentation), upstream recipe"

datasets:
  - data/preprocessed/spatial.pt
  - data/preprocessed/object.pt
  - data/preprocessed/goal.pt
  - data/preprocessed/long.pt

checkpoint: HuggingFaceVLA/smolvla_libero
seed: 42

# Match the recipe used to train HuggingFaceVLA/smolvla_libero exactly:
#   * Source: SmolVLA paper §4.3 (100k steps, batch_size=64) + lerobot/issues/3287
#     + the policy config.json shipped with the checkpoint.
#   * scripts/train_sft.py already defaults to AdamW(betas=(0.9, 0.95),
#     weight_decay=1e-10), so we only have to set the few knobs that differ
#     from the script defaults (in our case, none of the optimizer ones).
lr: 1.0e-4
batch_size: 64
micro_batch_size: 4
warmup_steps: 1000
decay_steps: 30000
decay_lr: 2.5e-6
grad_clip_norm: 10.0
action_chunk_size: 50

# 25 epochs at ~4.4k optimizer steps/epoch on the 4-suite dataset gives
# ~110k optimizer steps — matches the paper's 100k step budget.
num_epochs: 25

eval_every: 5
eval_episodes: 100
max_steps: 220

simulator: libero
eval_suite: spatial

wandb_project: srpo-smolvla
wandb_name: aug_sft_chunk1_jobA_control

notes: >-
  Plain continued SFT control for the augmented-vs-control comparison.
  Mirrors Job B (sft_libero_all_augmented.yaml) on every hyperparameter
  EXCEPT the perturbed datasets, online augmentation knobs, and
  instruction-variant JSON.

  Recipe is paper-faithful: we restart the LeRobot SmolVLA cosine schedule
  (warmup=1k -> decay=30k to 2.5e-6) on top of the converged checkpoint.
  The first 30k optimizer steps re-do the warmup+decay (light "shock" but
  the converged weights absorb it because the rest of the schedule matches
  the original endpoint), and the remaining ~80k steps run at the low
  decay_lr=2.5e-6 floor — that's where the actual continued-SFT learning
  happens.

  Eval suite stays spatial because that is the primary metric for the plan;
  cross-suite generalisation is measured post-hoc in the eval phase.

submit_with: jobs/sft_libero_all_control_l40s.sh
